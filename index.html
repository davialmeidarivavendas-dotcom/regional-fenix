<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Regional Fênix</title>
<style>body{margin:0;background:#070605;color:#f6efe6;font-family:Segoe UI,Arial,sans-serif}header,main{padding:18px 24px}h1 span{color:#f0b429}.periods button{background:#24160f;color:#f0b429;border:1px solid #6a3b18;border-radius:99px;padding:8px 14px;margin-right:8px}.periods button.active{background:linear-gradient(90deg,#ff3d00,#f0b429);color:#1a0d06}.papeis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.papel{background:#1a110d;border:1px solid #6a3b18;border-radius:14px;padding:14px}.papel b{font-size:32px}.mix{display:flex;height:14px;border-radius:99px;overflow:hidden;background:#2a1b13;margin:10px 0}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #3a2618;text-align:left}@media(max-width:800px){.papeis{grid-template-columns:1fr}}</style></head><body>
<header><h1>Regional <span>Fênix</span></h1><div class="periods" id="periods"></div></header>
<main><h2 style="color:#f0b429">Clientes recebidos</h2><div class="papeis" id="recebidos"></div><h2 style="color:#f0b429">Gerentes</h2><table><tbody id="mgr"></tbody></table></main>
<script>
const weeks={"05/10":{grupos:[{papel:"FAST",total:364,lead:361,whats:1,outros:2},{papel:"GA",total:80,lead:53,whats:26,outros:1},{papel:"DIANA",total:12,lead:5,whats:6,outros:1}],gerentes:[{nome:"Clara",ag:37,visita:14,pasta:12,venda:0},{nome:"Leal",ag:33,visita:7,pasta:9,venda:4},{nome:"John",ag:56,visita:15,pasta:13,venda:4},{nome:"Jacson",ag:20,visita:4,pasta:2,venda:2}]},"14/09":{cards:[{n:"Fast Ops",v:126,c:"#ff5a1f"},{n:"SDR",v:3,c:"#f0b429"},{n:"WhatsApp",v:20,c:"#3ddc84"},{n:"Outros",v:73,c:"#c084fc"}],gerentes:[{nome:"Clara",ag:61,visita:9,pasta:4,venda:1},{nome:"Leal",ag:46,visita:5,pasta:5,venda:0},{nome:"John",ag:43,visita:12,pasta:9,venda:1},{nome:"Jacson",ag:9,visita:1,pasta:1,venda:0}]},"21/09":{cards:[{n:"Fast Ops",v:120,c:"#ff5a1f"},{n:"SDR",v:3,c:"#f0b429"},{n:"WhatsApp",v:28,c:"#3ddc84"},{n:"Outros",v:78,c:"#c084fc"}],gerentes:[{nome:"Clara",ag:54,visita:19,pasta:5,venda:2},{nome:"Leal",ag:68,visita:10,pasta:5,venda:1},{nome:"John",ag:85,visita:15,pasta:9,venda:2},{nome:"Jacson",ag:21,visita:2,pasta:1,venda:0}]},"28/09":{cards:[{n:"Fast Ops",v:87,c:"#ff5a1f"},{n:"SDR",v:0,c:"#f0b429"},{n:"WhatsApp",v:39,c:"#3ddc84"},{n:"Outros",v:99,c:"#c084fc"}],gerentes:[{nome:"Clara",ag:82,visita:24,pasta:7,venda:1},{nome:"Leal",ag:74,visita:10,pasta:3,venda:1},{nome:"John",ag:63,visita:14,pasta:7,venda:3},{nome:"Jacson",ag:20,visita:6,pasta:4,venda:1}]}};
function render(id){const w=weeks[id];document.getElementById("periods").innerHTML=Object.keys(weeks).map(k=>`<button class="${k===id?"active":""}" data-id="${k}">${k}</button>`).join("");document.querySelectorAll("#periods button").forEach(b=>b.onclick=()=>render(b.dataset.id));const box=document.getElementById("recebidos");if(w.grupos){box.innerHTML=w.grupos.map(g=>`<article class="papel"><div>${g.papel} <b>${g.total}</b></div><div class="mix"><span style="width:${g.lead/g.total*100}%;background:#ff6a2a"></span><span style="width:${g.whats/g.total*100}%;background:#3ddc84"></span><span style="width:${g.outros/g.total*100}%;background:#c084fc"></span></div><div>Lead ADS ${g.lead} · WhatsApp ${g.whats} · Outros ${g.outros}</div></article>`).join("");}else{box.innerHTML=w.cards.map(x=>`<article class="papel" style="border-color:${x.c}"><div>${x.n} <b>${x.v}</b></div></article>`).join("");}document.getElementById("mgr").innerHTML="<tr><th>Gerente</th><th>Agend.</th><th>Visita</th><th>Pasta</th><th>Venda</th></tr>"+w.gerentes.map(g=>`<tr><td>${g.nome}</td><td>${g.ag}</td><td>${g.visita}</td><td>${g.pasta}</td><td>${g.venda}</td></tr>`).join("");}
render("05/10");
</script></body></html>
